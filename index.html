<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Query Planner</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- The mark is the planner's own DP lattice: three single-relation cells,
         two pairs, and the one plan it kept. Only the kept cell is filled. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Paired so the browser chrome follows the theme the reader is actually
         in, rather than the one the manifest happens to name. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7eaee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101317" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Query Planner" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Query Planner" />
    <meta property="og:title" content="Query Planner" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="https://andifathulms.github.io/query-planner/" />
    <meta property="og:image" content="https://andifathulms.github.io/query-planner/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Query Planner: estimated, then what happened." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Query Planner" />
    <meta name="twitter:description" content="%DESCRIPTION%" />
    <meta name="twitter:image" content="https://andifathulms.github.io/query-planner/brand/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The app renders on the client, so a crawler that does not run
         JavaScript would otherwise find an empty document. This is the same
         sentence the page itself opens with, written in at build time. -->
    <noscript>
      <h1>Query Planner</h1>
      <p>%DESCRIPTION%</p>
      <p>
        It needs JavaScript, because it contains its own database engine: storage, a
        B-tree index, statistics collected from a sample, selectivity estimation, a cost
        model, Selinger plan enumeration and a volcano-model executor. Nothing is sent
        anywhere; there are no network requests at runtime.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
